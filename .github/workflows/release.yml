name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Tag (Leave empty to use CHANGELOG.md latest)'
        required: false
        default: ''
      release_notes:
        description: 'Short Summary (Edit the full release page later for long text)'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release (Uncheck to only build artifacts)'
        required: false
        type: boolean
        default: true
      platform:
        description: 'Which platform(s) to build'
        required: false
        type: choice
        options:
          - all
          - windows
          - linux
        default: all

permissions:
  contents: write

jobs:
  # ── Shared version resolution ──────────────────────────────────────────────
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      clean_version: ${{ steps.ver.outputs.clean_version }}
      build_windows: ${{ steps.ver.outputs.build_windows }}
      build_linux: ${{ steps.ver.outputs.build_linux }}
      create_release: ${{ steps.ver.outputs.create_release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Platforms
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_CREATE_RELEASE: ${{ inputs.create_release }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "${REF_TYPE}" == "tag" ]]; then
            FINAL_VERSION="${REF_NAME}"
            echo "Triggered by Git Tag: ${FINAL_VERSION}"
          elif [[ -n "${INPUT_VERSION// }" ]]; then
            FINAL_VERSION="${INPUT_VERSION}"
            echo "Triggered manually with input: ${FINAL_VERSION}"
          else
            echo "Reading latest version from CHANGELOG.md..."
            if [[ ! -f CHANGELOG.md ]]; then
              echo "CHANGELOG.md not found!" >&2
              exit 1
            fi
            DETECTED="$(grep -m1 -E '^## \[(v?[0-9]+\.[0-9].*)\]' CHANGELOG.md | sed -E 's/^## \[//; s/\].*//')"
            if [[ -z "${DETECTED}" ]]; then
              echo "Could not find any version header (## [x.x.x]) in CHANGELOG.md!" >&2
              exit 1
            fi
            FINAL_VERSION="${DETECTED}"
            echo "Found latest version in CHANGELOG: ${FINAL_VERSION}"
          fi

          FINAL_VERSION="$(echo "${FINAL_VERSION}" | tr -d '[:space:]')"
          if [[ "${FINAL_VERSION}" != [vV]* ]]; then
            FINAL_VERSION="v${FINAL_VERSION}"
          fi
          CLEAN_VERSION="${FINAL_VERSION#v}"
          CLEAN_VERSION="${CLEAN_VERSION#V}"

          # Platform selection: tags always build all; dispatch respects input
          PLATFORM="${INPUT_PLATFORM:-all}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            PLATFORM="all"
          fi
          case "${PLATFORM}" in
            all)
              BUILD_WINDOWS=true
              BUILD_LINUX=true
              ;;
            windows)
              BUILD_WINDOWS=true
              BUILD_LINUX=false
              ;;
            linux)
              BUILD_WINDOWS=false
              BUILD_LINUX=true
              ;;
            *)
              echo "Unknown platform: ${PLATFORM}" >&2
              exit 1
              ;;
          esac

          # create_release: true on tag push; honor input on workflow_dispatch
          if [[ "${EVENT_NAME}" == "push" ]]; then
            CREATE_RELEASE=true
          else
            # inputs.create_release is the string "true"/"false" for boolean inputs
            if [[ "${INPUT_CREATE_RELEASE}" == "true" ]]; then
              CREATE_RELEASE=true
            else
              CREATE_RELEASE=false
            fi
          fi

          echo "Final version: ${FINAL_VERSION} (clean=${CLEAN_VERSION})"
          echo "Build windows=${BUILD_WINDOWS} linux=${BUILD_LINUX} create_release=${CREATE_RELEASE}"
          echo "::notice::Building Release: ${FINAL_VERSION} (windows=${BUILD_WINDOWS}, linux=${BUILD_LINUX})"

          {
            echo "version=${FINAL_VERSION}"
            echo "clean_version=${CLEAN_VERSION}"
            echo "build_windows=${BUILD_WINDOWS}"
            echo "build_linux=${BUILD_LINUX}"
            echo "create_release=${CREATE_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

  # ── Windows (existing Nuitka + cx_Freeze split) ────────────────────────────
  build-windows:
    needs: determine-version
    if: needs.determine-version.outputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch Version in src/version.py
        shell: pwsh
        env:
          CLEAN_VERSION: ${{ needs.determine-version.outputs.clean_version }}
        run: |
          $cleanVersion = "$env:CLEAN_VERSION"
          Write-Host "Patching src/version.py to version: $cleanVersion"
          $filePath = "src/version.py"
          $content = Get-Content $filePath -Raw
          $pattern = '__version__\s*=\s*["'']([^"'']+)["'']'
          if ($content -match $pattern) {
              $newContent = $content -replace $pattern, "__version__ = ""$cleanVersion"""
              [System.IO.File]::WriteAllText((Get-Item $filePath).FullName, $newContent)
          } else {
              Write-Warning "Could not find version string in src/version.py! Proceeding with existing version."
          }

      - name: Build Internal Standalone (Binaries)
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: standalone
          output-dir: build_internal
          enable-plugins: tk-inter
          windows-console-mode: hide
          windows-icon-from-ico: icon.ico
          include-data-dir: assets=assets
          include-data-files: icon.ico=icon.ico
          include-package: rich
          include-package-data: |
            customtkinter
            emoji
          nofollow-import-to: |
            pytest
            unittest
            notebook
            numpy
            pandas
            scipy
            matplotlib
            cv2
            xmlrpc
            curses
          noinclude-unittest-mode: nofollow
          output-filename: AIPromptBridge_Internal.exe

      - name: Build Launchers (Python cx_Freeze)
        shell: pwsh
        run: |
          Write-Host "Installing cx_Freeze..."
          pip install cx_Freeze

          Write-Host "Building Launchers with cx_Freeze..."
          python src/launchers/setup_launchers.py build

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build launchers!"
            exit 1
          }

          $buildDir = "build_launchers_cx"
          if (Test-Path $buildDir) {
             Write-Host "✓ Build successful. Contents:"
             Get-ChildItem -Recurse $buildDir | Select-Object Name, Length
          } else {
             Write-Error "Build directory not found!"
             exit 1
          }

      - name: Assemble Deployment Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          $distRoot = "dist_final"
          $binDir = "$distRoot/bin"

          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $internalSource = "build_internal/main.dist"
          if (-not (Test-Path $internalSource)) { Write-Error "Internal build not found at $internalSource"; exit 1 }

          Copy-Item -Path "$internalSource/*" -Destination $binDir -Recurse -Force

          $buildDir = "build_launchers_cx"
          Write-Host "Copying Launcher runtime files to root..."
          Copy-Item -Path "$buildDir/*" -Destination $distRoot -Recurse -Force

          if (-not (Test-Path "$distRoot/AIPromptBridge.exe")) {
             Write-Error "Console Launcher missing!"
             exit 1
          }
          if (-not (Test-Path "$distRoot/AIPromptBridge-NoConsole.exe")) {
             Write-Error "GUI Launcher missing!"
             exit 1
          }

          $zipName = "AIPromptBridge-$env:RELEASE_VERSION-windows-x86_64.zip"
          Compress-Archive -Path "$distRoot\*" -DestinationPath $zipName
          Write-Host "Created $zipName"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPromptBridge-${{ needs.determine-version.outputs.version }}-windows-x86_64
          path: AIPromptBridge-${{ needs.determine-version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error
          include-hidden-files: true

  # ── Linux (Nuitka standalone + shell launcher) ─────────────────────────────
  build-linux:
    needs: determine-version
    if: needs.determine-version.outputs.build_linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system build dependencies (Xft Tk + PortAudio)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3.13 \
            python3.13-dev \
            python3.13-venv \
            python3.13-tk \
            build-essential \
            patchelf \
            ccache \
            pkg-config \
            portaudio19-dev \
            libportaudio2 \
            xvfb \
            libxft2 \
            libx11-6

      - name: Probe Tk font stack (require Xft, not bitmap-only)
        run: |
          set -euo pipefail
          # Headless display for Tk root; fail closed if only "fixed" fonts exist.
          xvfb-run -a python3.13 - <<'PY'
          import tkinter as tk
          root = tk.Tk()
          root.withdraw()
          families = root.tk.call("font", "families")
          n = len(families)
          actual = root.tk.call("font", "actual", "TkDefaultFont")
          print(f"Tk font families: {n}")
          print(f"TkDefaultFont actual: {actual}")
          root.destroy()
          if n <= 5:
              raise SystemExit(
                  f"Tk font stack looks degraded ({n} families). "
                  "Need distro python3.13-tk with Xft for CustomTkinter freeze."
              )
          PY

      - name: Create venv and install Python deps
        run: |
          set -euo pipefail
          python3.13 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Nuitka + common helpers (ordered-set/zstandard speed up standalone)
          pip install "nuitka" "ordered-set" "zstandard"

      - name: Patch Version in src/version.py
        env:
          CLEAN_VERSION: ${{ needs.determine-version.outputs.clean_version }}
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python3.13 - <<'PY'
          import os, re
          path = "src/version.py"
          clean = os.environ["CLEAN_VERSION"]
          text = open(path, encoding="utf-8").read()
          new, n = re.subn(
              r'__version__\s*=\s*["\'][^"\']+["\']',
              f'__version__ = "{clean}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not patch __version__ in src/version.py")
          open(path, "w", encoding="utf-8").write(new)
          print(f"Patched __version__ = {clean!r}")
          PY

      - name: Build Internal Standalone (Nuitka)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p "${CCACHE_DIR}"
          export PATH="/usr/lib/ccache:${PATH}"

          python -m nuitka \
            --standalone \
            --output-dir=build_internal \
            --output-filename=AIPromptBridge_Internal \
            --enable-plugin=tk-inter \
            --include-data-dir=assets=assets \
            --include-data-files=icon.ico=icon.ico \
            --include-package=rich \
            --include-package-data=customtkinter \
            --include-package-data=emoji \
            --nofollow-import-to=pytest \
            --nofollow-import-to=unittest \
            --nofollow-import-to=notebook \
            --nofollow-import-to=numpy \
            --nofollow-import-to=pandas \
            --nofollow-import-to=scipy \
            --nofollow-import-to=matplotlib \
            --nofollow-import-to=cv2 \
            --nofollow-import-to=xmlrpc \
            --nofollow-import-to=curses \
            --noinclude-unittest-mode=nofollow \
            --assume-yes-for-downloads \
            --quiet \
            --lto=no \
            main.py

          echo "Build completed successfully."
          ls -la build_internal/ || true

      - name: Assemble Linux tarball
        env:
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/assemble_linux_package.sh scripts/linux_launcher.sh
          ./scripts/assemble_linux_package.sh "${RELEASE_VERSION}" .
          ls -lh AIPromptBridge-*-linux-x86_64.tar.gz

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIPromptBridge-${{ needs.determine-version.outputs.version }}-linux-x86_64
          path: AIPromptBridge-${{ needs.determine-version.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error
          include-hidden-files: true

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  publish-release:
    needs: [determine-version, build-windows, build-linux]
    # Skipped platform jobs report result=skipped; always() lets us still publish
    # when the selected platform(s) succeeded and create_release is true.
    if: |
      always() &&
      !cancelled() &&
      needs.determine-version.result == 'success' &&
      needs.determine-version.outputs.create_release == 'true' &&
      (needs.determine-version.outputs.build_windows != 'true' || needs.build-windows.result == 'success') &&
      (needs.determine-version.outputs.build_linux != 'true' || needs.build-linux.result == 'success') &&
      (needs.determine-version.outputs.build_windows == 'true' || needs.determine-version.outputs.build_linux == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows artifact
        if: needs.determine-version.outputs.build_windows == 'true'
        uses: actions/download-artifact@v4
        with:
          name: AIPromptBridge-${{ needs.determine-version.outputs.version }}-windows-x86_64
          path: release-assets

      - name: Download Linux artifact
        if: needs.determine-version.outputs.build_linux == 'true'
        uses: actions/download-artifact@v4
        with:
          name: AIPromptBridge-${{ needs.determine-version.outputs.version }}-linux-x86_64
          path: release-assets

      - name: Prepare Release Notes
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_BODY=release_body.md
          if [[ -n "${INPUT_NOTES// }" ]]; then
            printf '%s\n' "${INPUT_NOTES}" > "${RELEASE_BODY}"
          elif [[ -f CHANGELOG.md ]]; then
            python3 scripts/extract_changelog_section.py \
              --changelog CHANGELOG.md \
              --version "${RELEASE_VERSION}" \
              --output "${RELEASE_BODY}"
          else
            echo "Release ${RELEASE_VERSION}" > "${RELEASE_BODY}"
          fi
          echo "Release body:"
          cat "${RELEASE_BODY}"
          echo "---"
          ls -la release-assets || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          name: ${{ needs.determine-version.outputs.version }}
          body_path: release_body.md
          files: release-assets/*
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
