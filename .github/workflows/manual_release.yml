name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Tag (Leave empty to use latest Git tag)'
        required: false
        default: '' # Leave blank to default to git tag
      release_notes:
        description: 'Short Summary (Edit the full release page later for long text)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to get git tags

      # --- LOGIC TO HANDLE EMPTY INPUT ---
      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $inputVer = "${{ inputs.version }}"
          
          if ([string]::IsNullOrWhiteSpace($inputVer)) {
            try {
              # Get the latest tag from git (e.g., v2.8.0)
              $gitTag = git describe --tags --abbrev=0
              Write-Host "No input provided. Detected latest git tag: $gitTag"
              $finalVersion = $gitTag
            } catch {
              Write-Error "No input provided and no Git tags found in repository!"
              exit 1
            }
          } else {
            $inputVer = $inputVer.Trim()
            if (-not ($inputVer.ToLower().StartsWith("v"))) {
              $finalVersion = "v$inputVer"
              Write-Host "Added 'v' prefix to input: $finalVersion"
            } else {
              $finalVersion = $inputVer
              Write-Host "Using user input version: $finalVersion"
            }
          }
          
          # Save to GITHUB_ENV so all other steps use this variable
          echo "RELEASE_VERSION=$finalVersion" >> $env:GITHUB_ENV
          
          # Set the job name dynamically for the UI
          echo "::notice::Building Release: $finalVersion"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch Version in src/version.py
        shell: pwsh
        run: |
          # Use the variable we calculated in step 1
          $fullVersion = "$env:RELEASE_VERSION"
          
          # Strip 'v' prefix for version.py (e.g., v2.8.0 -> 2.8.0)
          $cleanVersion = $fullVersion.TrimStart('vV')
          
          Write-Host "Patching src/version.py to version: $cleanVersion"
          
          $filePath = "src/version.py"
          $content = Get-Content $filePath -Raw
          
          # Match __version__ = "..."
          $pattern = '__version__\s*=\s*["'']([^"'']+)["'']'
          
          if ($content -match $pattern) {
              $newContent = $content -replace $pattern, "__version__ = ""$cleanVersion"""
              [System.IO.File]::WriteAllText((Get-Item $filePath).FullName, $newContent)
          } else {
              Write-Warning "Could not find version string in src/version.py! Proceeding with existing version."
          }

      - name: Build Internal Standalone (Binaries)
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: standalone
          output-dir: build_internal
          # Nuitka config in main.py specifies output-filename=AIPromptBridge_Internal.exe

      - name: Build GUI Launcher
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: launcher_gui.py
          mode: onefile
          output-dir: build_launchers
          # Nuitka config in launcher_gui.py specifies output-filename=AIPromptBridge.exe

      - name: Build Console Launcher
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: launcher_console.py
          mode: onefile
          output-dir: build_launchers
          # Nuitka config in launcher_console.py specifies output-filename=AIPromptBridge-Console.exe

      - name: Assemble Deployment Package
        id: assemble_package
        shell: pwsh
        run: |
          # Define structure
          $distRoot = "dist_final"
          $binDir = "$distRoot/bin"
          
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          
          # 1. Move Internal Standalone to bin/
          # Nuitka-Action outputs standalone to {output-dir}/{script-name}.dist
          $internalSource = "build_internal/main.dist"
          if (-not (Test-Path $internalSource)) { Write-Error "Internal build not found at $internalSource"; exit 1 }
          
          # Move contents of dist to bin/
          Copy-Item -Path "$internalSource/*" -Destination $binDir -Recurse -Force
          
          # 2. Move Launchers to Root
          # Onefile outputs are directly in output-dir
          $launcherGui = "build_launchers/AIPromptBridge.exe"
          $launcherConsole = "build_launchers/AIPromptBridge-Console.exe"
          
          if (Test-Path $launcherGui) {
              Copy-Item -Path $launcherGui -Destination $distRoot
              Write-Host "GUI Launcher copied."
          } else {
              Write-Error "GUI Launcher not found!"
              exit 1
          }
          
          if (Test-Path $launcherConsole) {
              Copy-Item -Path $launcherConsole -Destination $distRoot
              Write-Host "Console Launcher copied."
          } else {
              Write-Error "Console Launcher not found!"
              exit 1
          }
          
          # 3. Copy Additional Files
          
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" $distRoot }
          if (Test-Path "README.md") { Copy-Item "README.md" $distRoot }

          # Zip it up
          $zipName = "AIPromptBridge-$env:RELEASE_VERSION.zip"
          Compress-Archive -Path "$distRoot\*" -DestinationPath $zipName
          
          echo "ASSET_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          # Use the determined version
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: ${{ inputs.release_notes }}
          files: ${{ env.ASSET_PATH }}
          prerelease: false
          generate_release_notes: true
