name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Tag (Leave empty to use CHANGELOG.md latest)'
        required: false
        default: '' # Leave blank to use CHANGELOG.md
      release_notes:
        description: 'Short Summary (Edit the full release page later for long text)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to get git tags

      # --- LOGIC TO HANDLE EMPTY INPUT ---
      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          # Priority:
          # 1. Git Tag (if triggered by tag push)
          # 2. Workflow Input (if provided manually)
          # 3. CHANGELOG.md Latest Version (if manually triggered empty)

          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"
          $inputVer = "${{ inputs.version }}"
          $changelogPath = "CHANGELOG.md"

          if ($refType -eq 'tag') {
              # 1. Triggered by Tag
              Write-Host "Triggered by Git Tag: $refName"
              $finalVersion = $refName
          } elseif (-not [string]::IsNullOrWhiteSpace($inputVer)) {
              # 2. Manual Trigger with Input
              Write-Host "Triggered manually with input: $inputVer"
              $finalVersion = $inputVer
          } else {
              # 3. Manual Trigger Empty -> Read CHANGELOG.md
              Write-Host "Triggered manually (empty input). Reading latest version from $changelogPath..."
              
              if (Test-Path $changelogPath) {
                  $content = Get-Content $changelogPath -Raw
                  # Regex to find the first version header like ## [4.0.1] or ## [v4.0.1]
                  # We only care about the first match (latest version)
                  if ($content -match '## \[(v?[\d\.]+)\]') {
                      $detectedVersion = $Matches[1]
                      Write-Host "Found latest version in CHANGELOG: $detectedVersion"
                      $finalVersion = $detectedVersion
                  } else {
                      Write-Error "Could not find any version header (## [x.x.x]) in $changelogPath!"
                      exit 1
                  }
              } else {
                  Write-Error "$changelogPath not found!"
                  exit 1
              }
          }

          # Normalize to ensure 'v' prefix for Release Tag/Title consistency
          $finalVersion = $finalVersion.Trim()
          if (-not $finalVersion.ToLower().StartsWith("v")) {
              $finalVersion = "v$finalVersion"
          }
          
          Write-Host "Final Determined Version: $finalVersion"
          
          # Save to GITHUB_ENV so all other steps use this variable
          echo "RELEASE_VERSION=$finalVersion" >> $env:GITHUB_ENV
          
          # Set the job name dynamically for the UI
          echo "::notice::Building Release: $finalVersion"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch Version in src/version.py
        shell: pwsh
        run: |
          # Use the variable we calculated in step 1
          $fullVersion = "$env:RELEASE_VERSION"
          
          # Strip 'v' prefix for version.py (e.g., v2.8.0 -> 2.8.0)
          $cleanVersion = $fullVersion.TrimStart('vV')
          
          Write-Host "Patching src/version.py to version: $cleanVersion"
          
          $filePath = "src/version.py"
          $content = Get-Content $filePath -Raw
          
          # Match __version__ = "..."
          $pattern = '__version__\s*=\s*["'']([^"'']+)["'']'
          
          if ($content -match $pattern) {
              $newContent = $content -replace $pattern, "__version__ = ""$cleanVersion"""
              [System.IO.File]::WriteAllText((Get-Item $filePath).FullName, $newContent)
          } else {
              Write-Warning "Could not find version string in src/version.py! Proceeding with existing version."
          }

      - name: Build Internal Standalone (Binaries)
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: standalone
          output-dir: build_internal
          # Migrated from main.py
          enable-plugins: tk-inter
          windows-console-mode: attach
          windows-icon-from-ico: icon.ico
          include-data-dir: assets=assets
          include-data-files: icon.ico=icon.ico
          include-package: rich
          include-package-data: |
            customtkinter
            emoji
          nofollow-import-to: |
            pytest
            unittest
            notebook
            numpy
            pandas
            scipy
            matplotlib
            cv2
            xmlrpc
            curses
          noinclude-unittest-mode: nofollow
          output-filename: AIPromptBridge_Internal.exe

      - name: Build Launchers (Python cx_Freeze)
        shell: pwsh
        run: |
          Write-Host "Installing cx_Freeze..."
          pip install cx_Freeze
          
          Write-Host "Building Launchers with cx_Freeze..."
          python src/launchers/setup_launchers.py build
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build launchers!"
            exit 1
          }
          
          # cx_Freeze output is in build_launchers_cx/
          # We need to verify what's inside
          $buildDir = "build_launchers_cx"
          
          if (Test-Path $buildDir) {
             Write-Host "✓ Build successful. Contents:"
             Get-ChildItem -Recurse $buildDir | Select-Object Name, Length
          } else {
             Write-Error "Build directory not found!"
             exit 1
          }

      - name: Assemble Deployment Package
        id: assemble_package
        shell: pwsh
        run: |
          # Define structure
          $distRoot = "dist_final"
          $binDir = "$distRoot/bin"
          
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          
          # 1. Move Internal Standalone to bin/
          # Nuitka-Action outputs standalone to {output-dir}/{output-filename}.dist when output-filename is provided
          # Update: It actually to defaults to {script-name-base}.dist despite output-filename
          $internalSource = "build_internal/main.dist"
          if (-not (Test-Path $internalSource)) { Write-Error "Internal build not found at $internalSource"; exit 1 }
          
          # Move contents of dist to bin/
          Copy-Item -Path "$internalSource/*" -Destination $binDir -Recurse -Force
          
          # 2. Move Launchers to Root
          # cx_Freeze creates a directory structure. Since we want the launcher at root,
          # we move ALL contents of the build directory to the root of the distribution.
          # This includes AIPromptBridge.exe, python DLLs, etc.
          
          $buildDir = "build_launchers_cx"
          
          # Copy everything from build_launchers_cx/* to dist_final/
          Write-Host "Copying Launcher runtime files to root..."
          Copy-Item -Path "$buildDir/*" -Destination $distRoot -Recurse -Force
          
          # Verify executables
          if (Test-Path "$distRoot/AIPromptBridge.exe") {
             Write-Host "✓ Console Launcher present"
          } else {
             Write-Error "Console Launcher missing!"
             exit 1
          }
          
          if (Test-Path "$distRoot/AIPromptBridge-NoConsole.exe") {
             Write-Host "✓ GUI Launcher present"
          } else {
             Write-Error "GUI Launcher missing!"
             exit 1
          }

          # Zip it up
          $zipName = "AIPromptBridge-$env:RELEASE_VERSION.zip"
          Compress-Archive -Path "$distRoot\*" -DestinationPath $zipName
          
          echo "ASSET_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Prepare Release Notes
        id: release_notes
        shell: pwsh
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          $releaseBodyFile = "release_body.md"
          
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_NOTES)) {
             Write-Host "User provided release notes."
             $env:INPUT_NOTES | Out-File -FilePath $releaseBodyFile -Encoding utf8
          } else {
             Write-Host "No input notes provided. Extracting from CHANGELOG.md..."
             $version = "$env:RELEASE_VERSION"
             $cleanVersion = $version.TrimStart('vV')
             $changelogPath = "CHANGELOG.md"
             
             if (Test-Path $changelogPath) {
                $content = Get-Content $changelogPath -Raw
                # Find start index of "## [$cleanVersion]"
                $searchStr = "## [$cleanVersion]"
                $startIndex = $content.IndexOf($searchStr)
                
                if ($startIndex -ge 0) {
                   $endIndex = $content.Length
                   
                   # Search for next "## [" starting after the current match
                   $nextSearchStart = $startIndex + $searchStr.Length
                   
                   # Regex to find next header start "## ["
                   $regex = [regex]"(?m)^## \["
                   $match = $regex.Match($content, $nextSearchStart)
                   
                   if ($match.Success) {
                      $endIndex = $match.Index
                   }
                   
                   $notes = $content.Substring($startIndex, $endIndex - $startIndex).Trim()
                   Write-Host "Found release notes for $cleanVersion"
                   $notes | Out-File -FilePath $releaseBodyFile -Encoding utf8
                } else {
                   Write-Warning "Could not find entry for '$searchStr' in CHANGELOG.md"
                   "Release $version" | Out-File -FilePath $releaseBodyFile -Encoding utf8
                }
             } else {
                Write-Warning "CHANGELOG.md not found!"
                "Release $version" | Out-File -FilePath $releaseBodyFile -Encoding utf8
             }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          # Use the determined version
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: release_body.md
          files: ${{ env.ASSET_PATH }}
          prerelease: false
          generate_release_notes: true
