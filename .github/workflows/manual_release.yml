name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Tag (Leave empty to use latest Git tag)'
        required: false
        default: '' # Leave blank to default to git tag
      release_notes:
        description: 'Short Summary (Edit the full release page later for long text)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to get git tags

      # --- LOGIC TO HANDLE EMPTY INPUT ---
      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $inputVer = "${{ inputs.version }}"
          
          if ([string]::IsNullOrWhiteSpace($inputVer)) {
            try {
              # Get the latest tag from git (e.g., v2.8.0)
              $gitTag = git describe --tags --abbrev=0
              Write-Host "No input provided. Detected latest git tag: $gitTag"
              $finalVersion = $gitTag
            } catch {
              Write-Error "No input provided and no Git tags found in repository!"
              exit 1
            }
          } else {
            $inputVer = $inputVer.Trim()
            if (-not ($inputVer.ToLower().StartsWith("v"))) {
              $finalVersion = "v$inputVer"
              Write-Host "Added 'v' prefix to input: $finalVersion"
            } else {
              $finalVersion = $inputVer
              Write-Host "Using user input version: $finalVersion"
            }
          }
          
          # Save to GITHUB_ENV so all other steps use this variable
          echo "RELEASE_VERSION=$finalVersion" >> $env:GITHUB_ENV
          
          # Set the job name dynamically for the UI
          echo "::notice::Building Release: $finalVersion"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch Version in src/version.py
        shell: pwsh
        run: |
          # Use the variable we calculated in step 1
          $fullVersion = "$env:RELEASE_VERSION"
          
          # Strip 'v' prefix for version.py (e.g., v2.8.0 -> 2.8.0)
          $cleanVersion = $fullVersion.TrimStart('vV')
          
          Write-Host "Patching src/version.py to version: $cleanVersion"
          
          $filePath = "src/version.py"
          $content = Get-Content $filePath -Raw
          
          # Match __version__ = "..."
          $pattern = '__version__\s*=\s*["'']([^"'']+)["'']'
          
          if ($content -match $pattern) {
              $newContent = $content -replace $pattern, "__version__ = ""$cleanVersion"""
              [System.IO.File]::WriteAllText((Get-Item $filePath).FullName, $newContent)
          } else {
              Write-Warning "Could not find version string in src/version.py! Proceeding with existing version."
          }

      - name: Build Internal Standalone (Binaries)
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: standalone
          output-dir: build_internal
          # Migrated from main.py
          enable-plugins: tk-inter
          windows-console-mode: attach
          windows-icon-from-ico: icon.ico
          include-data-dir: assets=assets
          include-data-files: icon.ico=icon.ico
          include-package: rich
          include-package-data: |
            customtkinter
            emoji
          nofollow-import-to: |
            pytest
            unittest
            notebook
            numpy
            pandas
            scipy
            matplotlib
            cv2
            xmlrpc
            curses
          noinclude-unittest-mode: nofollow
          output-filename: AIPromptBridge_Internal.exe

      - name: Build C# Launchers
        shell: pwsh
        run: |
          # Find csc.exe from .NET Framework (pre-installed on Windows)
          $cscPath = Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64\*\csc.exe" |
                     Sort-Object { [version]($_.Directory.Name -replace 'v', '') } -Descending |
                     Select-Object -First 1
          
          if (-not $cscPath) {
            Write-Error "Could not find csc.exe!"
            exit 1
          }
          
          Write-Host "Using C# compiler: $($cscPath.FullName)"
          
          # Create output directory
          New-Item -ItemType Directory -Force -Path "build_launchers" | Out-Null
          
          # Debug: List files to verify source existence
          Write-Host "Verifying source file existence:"
          if (Test-Path "src\launchers\Launcher.cs") {
              Write-Host "  Found src\launchers\Launcher.cs"
          } else {
              Write-Error "  src\launchers\Launcher.cs NOT FOUND!"
              Get-ChildItem -Recurse src | ForEach-Object { Write-Host "  $($_.FullName)" }
          }

          # Build Console Launcher (with console window) - Primary launcher
          Write-Host "Building Console Launcher (AIPromptBridge.exe)..."
          & $cscPath.FullName /target:exe `
                              /out:build_launchers\AIPromptBridge.exe `
                              /win32icon:icon.ico `
                              /define:CONSOLE `
                              /optimize+ `
                              src\launchers\Launcher.cs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build Console launcher!"
            exit 1
          }
          Write-Host "✓ Console Launcher built successfully"
          
          # Build No-Console Launcher (no console window)
          Write-Host "Building No-Console Launcher (AIPromptBridge-NoConsole.exe)..."
          & $cscPath.FullName /target:winexe `
                              /out:build_launchers\AIPromptBridge-NoConsole.exe `
                              /win32icon:icon.ico `
                              /define:GUI `
                              /optimize+ `
                              src\launchers\Launcher.cs
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to build No-Console launcher!"
            exit 1
          }
          Write-Host "✓ No-Console Launcher built successfully"
          
          # Show file sizes (should be ~10KB each vs ~7MB for Nuitka)
          Get-ChildItem build_launchers/*.exe | ForEach-Object {
            $sizeKB = [math]::Round($_.Length / 1KB, 1)
            Write-Host "  $($_.Name): $sizeKB KB"
          }

      - name: Assemble Deployment Package
        id: assemble_package
        shell: pwsh
        run: |
          # Define structure
          $distRoot = "dist_final"
          $binDir = "$distRoot/bin"
          
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          
          # 1. Move Internal Standalone to bin/
          # Nuitka-Action outputs standalone to {output-dir}/{output-filename}.dist when output-filename is provided
          # Update: It actually to defaults to {script-name-base}.dist despite output-filename
          $internalSource = "build_internal/main.dist"
          if (-not (Test-Path $internalSource)) { Write-Error "Internal build not found at $internalSource"; exit 1 }
          
          # Move contents of dist to bin/
          Copy-Item -Path "$internalSource/*" -Destination $binDir -Recurse -Force
          
          # 2. Move Launchers to Root
          $launcherConsole = "build_launchers/AIPromptBridge.exe"
          $launcherNoConsole = "build_launchers/AIPromptBridge-NoConsole.exe"
          
          if (Test-Path $launcherConsole) {
              Copy-Item -Path $launcherConsole -Destination $distRoot
              Write-Host "Console Launcher copied."
          } else {
              Write-Error "Console Launcher not found!"
              exit 1
          }
          
          if (Test-Path $launcherNoConsole) {
              Copy-Item -Path $launcherNoConsole -Destination $distRoot
              Write-Host "No-Console Launcher copied."
          } else {
              Write-Error "No-Console Launcher not found!"
              exit 1
          }

          # Zip it up
          $zipName = "AIPromptBridge-$env:RELEASE_VERSION.zip"
          Compress-Archive -Path "$distRoot\*" -DestinationPath $zipName
          
          echo "ASSET_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          # Use the determined version
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: ${{ inputs.release_notes }}
          files: ${{ env.ASSET_PATH }}
          prerelease: false
          generate_release_notes: true
