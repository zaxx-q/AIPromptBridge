[project]
name = "AIPromptBridge"
version = "7.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter, not linter
    "E741",   # ambiguous variable name (common in math/short scripts)
    "B905",   # `zip()` without strict= (too noisy for existing code)
    "SIM108", # ternary operator — readability preference
    "RUF001", # ambiguous unicode — false positives with emoji/unicode-heavy code
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "UP035",  # deprecated typing imports — not urgent
]

[tool.ruff.lint.per-file-ignores]
# Be lenient with existing source code
"src/**/*.py" = [
    "F401",  # unused imports (many __init__.py re-exports)
    "F841",  # unused variables
    "E402",  # module-level import not at top (common pattern in this codebase)
    "B007",  # unused loop control variable
    "UP",    # pyupgrade suggestions (noisy on large codebase)
    "SIM",   # simplify suggestions (noisy on large codebase)
]
"main.py" = ["E402", "F401", "F841"]
"test/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
